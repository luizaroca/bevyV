[package]
name = "bevy_editor"
version = "0.20.0-dev"
edition = "2024"
description = "A scene editor for Bevy, modelled on the Unreal Engine editor workflow"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
bevy = { path = "../..", features = [
  "bevy_inspector",
  "bevy_dev_tools",
  "render_dev_tools",
  "debug",
] }

[lints]
workspace = true
