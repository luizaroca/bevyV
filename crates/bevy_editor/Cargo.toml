[package]
name = "bevy_editor"
version = "0.20.0-dev"
edition = "2024"
description = "A scene editor for Bevy, modelled on the Unreal Engine editor workflow"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
bevy = { path = "../..", features = [
  "bevy_inspector",
  "bevy_dev_tools",
  "render_dev_tools",
  "debug",
  "serialize",
  "experimental_pbr_pcss",
] }
# Native file and message dialogs for Save/Open.
rfd = "0.15"
ron = "0.12"
# Fork rendering features (SSGI) for World Settings.
bevy_extend = { path = "../bevy_extend" }
serde = "1"


[lints]
workspace = true
